# In-cluster LocalStack S3 emulator used by the Kubernetes e2e tests.
#
# This stands in for real AWS S3 during CI (analogous to how minikube stands
# in for a real cluster), so the tests never touch a real AWS account. The
# go-continuous-fuzz pod talks to it through the standard AWS_ENDPOINT_URL_S3
# environment variable, exactly as it would talk to real S3 in production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  labels:
    app: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          # Pinned to 4.4.0: the last release that runs S3 for free. From
          # 2026.03.0 onward LocalStack images require an auth token even for
          # community services and exit with code 55 without one.
          image: localstack/localstack:4.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4566
          env:
            - name: SERVICES
              value: "s3"
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  labels:
    app: localstack
spec:
  type: NodePort
  selector:
    app: localstack
  ports:
    - name: edge
      port: 4566
      targetPort: 4566
      nodePort: 31566
