serviceAccount:
  automount: true
  name: "go-continuous-fuzz-sa"

rbac:
  roleName: "go-continuous-fuzz-role"
  roleBindingName: "go-continuous-fuzz-rb"

aws:
  secretName: "go-continuous-fuzz-aws-creds"
  accessKeyId: ""
  secretAccessKey: ""
  region: ""
  sessionToken: ""
  # Optional S3 endpoint override. Leave empty to use real AWS S3. Set to a
  # local S3 emulator endpoint (e.g. LocalStack) to emulate AWS in CI.
  endpointUrl: ""

github:
  secretName: "go-continuous-fuzz-github-creds"
  authToken: ""

configMap:
  name: "go-continuous-fuzz-config"

project:
  workspacePath: "/var/lib/go-continuous-fuzz"
  logdir: "/var/lib/go-continuous-fuzz/logs"
  srcRepo: ""
  s3BucketName: ""

fuzz:
  inCluster: true
  crashRepo: ""
  pkgsPath:
  syncFrequency: ""
  corpusMinimizeInterval: ""
  iterations:
  numWorkers:

pod:
  name: "go-continuous-fuzz-pod"
  # Optional extra host-to-IP mappings added to the pod's /etc/hosts. Used in
  # CI to resolve the S3 emulator's hostname/bucket vhost to its ClusterIP.
  hostAliases: []
  container:
    name: "go-continuous-fuzz-container"
    image: "go-continuous-fuzz"
    imagePullPolicy: "Never"

pvc:
  name: "go-continuous-fuzz-pvc"
  storage: "8Gi"